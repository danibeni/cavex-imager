service:
  name: cavex_imager
  version: 1.0.0
  log_level: INFO

indigo:
  host: localhost
  port: 7624
  device_name: "(null) Logitech StreamCam"
  reconnect:
    enabled: true
    max_attempts: 0  # 0 = infinite
    backoff_max_s: 30

auth:
  enabled: false
  keys: []

lease:
  preempt_mode: graceful  # graceful | abort
  default_ttl_seconds: 120
  max_ttl_seconds: 600
  graceful_timeout_s: 60  # max seconds to wait for exposure before forcing preemption

storage:
  host_base_path: /opt/cavex/data
  container_base_path: /data
  min_free_gb: 10
  default_file_prefix: cavex
  default_naming_pattern: "{prefix}_{seq:04d}.fits"

telemetry:
  default_rate_hz: 1
  max_ws_clients: 10

logging:
  stdout:
    enabled: true
    format: json
  file:
    enabled: false
    path: /data/logs/cavex_imager.log
    max_bytes: 10485760  # 10MB
    backup_count: 5
    compress: true
