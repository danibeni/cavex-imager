server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API docs (Swagger UI / ReDoc / OpenAPI schema)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://cavex-imager:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Proxy REST API to the backend service
    location /api/ {
        proxy_pass         http://cavex-imager:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket telemetry
    location /api/v1/ws/ {
        proxy_pass         http://cavex-imager:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Proxy FITS image static files
    location /captures/ {
        proxy_pass       http://cavex-imager:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vue SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
